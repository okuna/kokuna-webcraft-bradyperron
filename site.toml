[site.prd]
file = "PRD.md"
setup = "npm install && npm run dev"
backend = "Static single-page application; no backend or runtime CMS"

[[screenshots]]
route = "/"
file = "screenshots/home-desktop.png"
device = "desktop"
side = "replica"

[[screenshots]]
route = "/"
file = "screenshots/home-mobile.png"
device = "mobile"
side = "replica"

[task]
format = "web_craft"
workstream = "web_craft"
