# docker-compose.yml — Docker is the single substrate for every Web Craft app.
# This front-end-only app is just the `app-runner` service alone. Compose owns
# the multi-service graph; app.toml stays out of that (no `services` field).

services:
  app-runner:
    build:
      context: .
      dockerfile: environment/Dockerfile
      args:
        http_proxy: ${APP_PROXY:-}
        https_proxy: ${APP_PROXY:-}
        no_proxy: ${APP_NO_PROXY:-localhost,127.0.0.1}
    working_dir: /workspace
    init: true
    command: ["bash", "-lc", "sleep infinity"] # idles; harness drives lifecycle in
    environment:
      http_proxy: ${APP_PROXY:-}
      https_proxy: ${APP_PROXY:-}
      HTTP_PROXY: ${APP_PROXY:-}
      HTTPS_PROXY: ${APP_PROXY:-}
      no_proxy: ${APP_NO_PROXY:-localhost,127.0.0.1}
      NO_PROXY: ${APP_NO_PROXY:-localhost,127.0.0.1}
      NODE_ENV: production
    volumes:
      - .:/workspace # bind-mount source (live edits)
      # Keep node_modules CONTAINER-PRIVATE, or a host-compiled cache leaks in
      # and corrupts the build (native deps differ mac<->linux).
      - app_node_modules:/workspace/node_modules
    # Publish the internal front-door port with NO host side -> ephemeral host
    # port, discovered by the harness (keeps parallel runs from colliding).
    ports:
      - "3000"

volumes:
  app_node_modules:
